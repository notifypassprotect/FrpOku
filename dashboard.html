 <style>
 body { margin: 0; overflow: auto; }
.dash-wrap {
 max-width: 1400px; margin: 0 auto;
 padding: 1.5rem;
 display: flex; flex-direction: column; gap: 1.5rem;
 }

 /* Header */
.dash-header {
 display: flex; align-items: center; justify-content: space-between;
 gap: 1rem; flex-wrap: wrap;
 }
.dash-title { font-size: 1.5rem; font-weight: 800; color: var(--text-primary); }
.dash-sub { font-size:.82rem; color: var(--text-muted); margin-top:.15rem; }

 /* Summary cards */
.dash-cards {
 display: grid;
 grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
 gap: 1rem;
 }
.dash-card {
 background: var(--bg-surface);
 border: 1px solid var(--border-light);
 border-radius: 14px;
 padding: 1.2rem 1rem 1rem;
 box-shadow: var(--shadow-sm);
 display: flex; flex-direction: column; gap:.3rem;
 position: relative; overflow: hidden;
 }
.dash-card::before {
 content: '';
 position: absolute; top: 0; left: 0; right: 0; height: 3px;
 background: var(--card-accent, var(--accent));
 }
.dash-card-icon { font-size: 1.8rem; }
.dash-card-value { font-size: 2rem; font-weight: 800; color: var(--text-primary); }
.dash-card-label { font-size:.72rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing:.05em; }
.dash-card-trend { font-size:.72rem; color: var(--green); margin-top:.1rem; }

 /* Chart grid */
.dash-charts {
 display: grid;
 grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
 gap: 1.5rem;
 }
.chart-box {
 background: var(--bg-surface);
 border: 1px solid var(--border-light);
 border-radius: 14px;
 padding: 1.25rem;
 box-shadow: var(--shadow-sm);
 }
.chart-title {
 font-size:.9rem; font-weight: 700; color: var(--text-primary);
 margin-bottom: 1rem; display: flex; align-items: center; gap:.4rem;
 }
.chart-canvas { width: 100%!important; }

 /* Gösterge tablosundaki tablolar */
.dash-table-wrap {
 background: var(--bg-surface);
 border: 1px solid var(--border-light);
 border-radius: 14px;
 overflow: hidden;
 box-shadow: var(--shadow-sm);
 }
.dash-table-header {
 padding: 1rem 1.25rem;
 font-weight: 700; font-size:.9rem;
 border-bottom: 1px solid var(--border);
 background: var(--bg-raised);
 }
.dash-tbl {
 width: 100%; border-collapse: collapse; font-size:.82rem;
 }
.dash-tbl th {
 text-align: left; padding:.55rem 1rem;
 background: var(--bg-raised);
 font-size:.72rem; font-weight: 700; text-transform: uppercase;
 letter-spacing:.04em; color: var(--text-muted);
 border-bottom: 1px solid var(--border);
 }
.dash-tbl td {
 padding:.55rem 1rem;
 border-bottom: 1px solid var(--border-light);
 color: var(--text-primary);
 }
.dash-tbl tr:last-child td { border-bottom: none; }
.dash-tbl tr:hover td { background: var(--bg-raised); }

 /* Progress bar */
.pbar-wrap { display: flex; align-items: center; gap:.5rem; }
.pbar {
 flex: 1; height: 6px; background: var(--border);
 border-radius: 3px; overflow: hidden;
 }
.pbar-fill { height: 100%; border-radius: 3px; transition: width.4s ease; }

 /* Health distribution */
.health-dist {
 display: flex; gap:.5rem; flex-wrap: wrap;
 }
.health-dist-item {
 flex: 1; min-width: 70px;
 background: var(--bg-raised);
 border-radius: 10px; padding:.7rem;
 text-align: center;
 border: 1px solid var(--border-light);
 }
.health-dist-score { font-size: 1.4rem; font-weight: 800; }
.health-dist-count { font-size:.82rem; color: var(--text-muted); }
.health-dist-label { font-size:.7rem; color: var(--text-muted); }
.dash-action-btn {
 display: inline-flex; align-items: center; gap:.45rem;
 padding:.5rem 1.1rem; border-radius: 10px; font-weight: 700; font-size:.84rem;
 border: 1px solid var(--border-light); cursor: pointer; transition: all.2s ease;
 background: var(--bg-surface); color: var(--text-primary);
 box-shadow: var(--shadow-sm);
 }
.dash-action-btn:hover {
 transform: translateY(-1px); box-shadow: var(--shadow-md);
 border-color: var(--accent); color: var(--accent);
 }
.dash-action-btn.back-btn {
 background: linear-gradient(135deg, var(--accent), #2563eb);
 color: #fff; border: none;
 }
.dash-action-btn.back-btn:hover {
 background: linear-gradient(135deg, #2563eb, #1d4ed8);
 color: #fff;
 }

 /* Responsive */
 @media (max-width: 600px) {
.dash-charts { grid-template-columns: 1fr; }
 }
 </style>
