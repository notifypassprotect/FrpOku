<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <title>FrpOku — Rapor Karşılaştırma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inconsolata:wght@400;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&family=Open+Sans:wght@400;600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Raleway:wght@400;600;700;800&family=Roboto:wght@400;500;700&family=Source+Code+Pro:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=4.3" />
  <link rel="stylesheet" href="css/list.css?v=4.3" />
  <link rel="stylesheet" href="css/compare.css?v=4.3" />
  <link rel="stylesheet" href="css/themes.css?v=4.3" />
  <link rel="stylesheet" href="css/online_presence.css?v=5.0" />
  <script src="js/core/theme_bootstrap.js?v=4.4"></script>
</head>
<body>
<div class="cmp-shell">

  <!-- ═══════════════ TOPBAR ═══════════════ -->
  <nav class="cmp-topbar">
    <!-- Sol -->
    <div class="cmp-topbar-left">
      <button class="btn btn-sm btn-ghost" id="btnBack" style="gap:.4rem;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        <span>Listeye Dön</span>
      </button>
      <div class="cmp-brand" style="display:flex;align-items:center;gap:.6rem;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="28" height="28" style="flex-shrink:0;filter:drop-shadow(0 2px 8px rgba(37,99,235,0.35));">
          <defs>
            <linearGradient id="cmpPrism" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#38bdf8" />
              <stop offset="40%" stop-color="#2563eb" />
              <stop offset="85%" stop-color="#4f46e5" />
              <stop offset="100%" stop-color="#7c3aed" />
            </linearGradient>
            <linearGradient id="cmpFold" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#0284c7" />
              <stop offset="50%" stop-color="#38bdf8" />
              <stop offset="100%" stop-color="#e0f2fe" />
            </linearGradient>
          </defs>
          <rect x="4" y="4" width="120" height="120" rx="28" fill="#0b1120" stroke="rgba(56,189,248,0.3)" stroke-width="2.5" />
          <path d="M 34 26 L 76 26 L 94 44 L 94 98 A 6 6 0 0 1 88 104 L 40 104 A 6 6 0 0 1 34 98 Z" fill="url(#cmpPrism)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" />
          <path d="M 76 26 L 76 40 A 4 4 0 0 0 80 44 L 94 44 Z" fill="url(#cmpFold)" />
          <rect x="44" y="40" width="24" height="4.5" rx="2.25" fill="#ffffff" opacity="0.95" />
          <rect x="44" y="52" width="40" height="3.5" rx="1.75" fill="#06b6d4" />
          <rect x="44" y="61" width="34" height="3.5" rx="1.75" fill="#cbd5e1" opacity="0.8" />
          <rect x="44" y="70" width="26" height="3.5" rx="1.75" fill="#94a3b8" opacity="0.7" />
          <g transform="translate(44, 80)">
            <rect x="0" y="8" width="6" height="10" rx="2" fill="#10b981" />
            <rect x="9" y="3" width="6" height="15" rx="2" fill="#06b6d4" />
            <rect x="18" y="0" width="6" height="18" rx="2" fill="#8b5cf6" />
            <rect x="27" y="5" width="6" height="13" rx="2" fill="#38bdf8" />
            <rect x="36" y="9" width="6" height="9" rx="2" fill="#a855f7" />
          </g>
        </svg>
        <div>
          <div class="cmp-brand-title">Rapor Karşılaştırma</div>
          <div class="cmp-brand-sub">Yan yana fark ve kod analizi</div>
        </div>
      </div>
    </div>

    <!-- Orta — Sekmeler (Kaydırılabilir & Hızlı Seçim Menülü) -->
    <div class="cmp-topbar-center">
      <button class="btn btn-sm btn-ghost cmp-tab-scroll-btn" id="btnTabScrollLeft" title="Sola Kaydır">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="tab-bar-scroll-wrap" id="tabBarScrollWrap">
        <div class="tab-bar" id="diffTabBar"></div>
      </div>
      <button class="btn btn-sm btn-ghost cmp-tab-scroll-btn" id="btnTabScrollRight" title="Sağa Kaydır">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <select class="field-select cmp-query-dropdown" id="selectQueryJump" title="Hızlı Sorgu Seçimi" style="display:none;">
        <option value="">Sorgu Seç...</option>
      </select>
    </div>

    <!-- Sağ — Araçlar -->
    <div class="cmp-topbar-right">
      <div class="cmp-diff-nav">
        <button class="btn btn-sm btn-ghost" id="btnPrevDiff" title="Önceki Fark (Alt+P)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
        </button>
        <span id="diffCounterBadge" class="badge badge-gray" style="font-size:.72rem;min-width:64px;text-align:center;">—</span>
        <button class="btn btn-sm btn-ghost" id="btnNextDiff" title="Sonraki Fark (Alt+N)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
      </div>
      <button class="btn btn-sm btn-ghost" id="btnToggleFold" title="Sadece Farkları Göster (değişmeyen satırlar katlanır)">Sadece Farklar</button>
      <button class="btn btn-sm btn-ghost" id="btnUndoTransfer" title="Son koda aktarımı geri al (Ctrl+Z)">Geri Al</button>
      <select class="field-select" id="selectDiffTheme" style="font-size:.78rem;padding:.28rem .5rem;border-radius:7px;" title="Diff Kod Teması">
        <option value="default">Varsayılan Tema</option>
        <option value="vscode-dark">VS Code Dark</option>
        <option value="github-light">GitHub Light</option>
        <option value="monokai">Monokai</option>
        <option value="solarized">Solarized</option>
      </select>
      <button class="theme-switch-pill" id="btnThemeToggle" title="Tema Değiştir">Koyu Mod</button>
    </div>
  </nav>

  <!-- ═══════════════ SELECTOR BAR ═══════════════ -->
  <div class="cmp-selector-bar">
    <!-- Rapor A -->
    <div class="cmp-slot" id="slotA">
      <div class="cmp-slot-label">
        <span class="cmp-slot-num">1</span>
        <span>Sol · Baz Rapor</span>
      </div>
      <button type="button" class="cmp-slot-btn" id="btnPickerA">
        <span class="cmp-slot-name" id="titleFileA">Rapor seçilmedi...</span>
        <span class="cmp-slot-change">Değiştir</span>
      </button>
    </div>

    <!-- Ayraç -->
    <div class="cmp-vs-badge">VS</div>

    <!-- Rapor B -->
    <div class="cmp-slot" id="slotB">
      <div class="cmp-slot-label">
        <span class="cmp-slot-num cmp-slot-num-b">2</span>
        <span>Sağ · Karşılaştırılan</span>
      </div>
      <button type="button" class="cmp-slot-btn" id="btnPickerB">
        <span class="cmp-slot-name" id="titleFileB">Rapor seçilmedi...</span>
        <span class="cmp-slot-change">Değiştir</span>
      </button>
    </div>

    <!-- 3. Panel -->
    <div class="cmp-slot cmp-slot-c" id="slotC">
      <div class="cmp-slot-label">
        <span class="cmp-slot-num cmp-slot-num-c">3</span>
        <span>Opsiyonel Panel</span>
      </div>
      <button type="button" class="cmp-slot-btn cmp-slot-btn-c" id="btnPickerC">
        <span class="cmp-slot-name" id="titleFileC">+ Panel Ekle</span>
        <span class="cmp-slot-change">Seç / Kaldır</span>
      </button>
    </div>

    <!-- Özet -->
    <div class="cmp-summary-pill" id="diffSummaryBar">
      <span>İki rapor seçin...</span>
    </div>

    <!-- Hidden selects (backward compat) -->
    <select id="selectFileA" style="display:none;"></select>
    <select id="selectFileB" style="display:none;"></select>
    <select id="selectFileC" style="display:none;"></select>
  </div>

  <!-- ═══════════════ DIFF VIEWPORT ═══════════════ -->
  <div class="cmp-diff-container" style="position:relative;">
    <div class="diff-grid" id="diffGrid">

      <!-- Sol Pane (A) -->
      <div class="diff-pane">
        <div class="diff-pane-header">
          <span id="labelPaneA" class="diff-pane-title">Rapor 1</span>
          <div style="display:flex;align-items:center;gap:.4rem;">
            <span class="badge badge-blue" id="badgePaneA" style="font-size:.68rem;">Baz</span>
            <button class="btn btn-sm btn-ghost cmp-pane-change" data-compare-action="picker" data-pane="A" title="Raporu Değiştir" style="font-size:.72rem;padding:2px 8px;">Değiştir</button>
          </div>
        </div>
        <div class="diff-scroll" id="scrollPaneA">
          <div class="diff-table" id="tablePaneA"></div>
        </div>
      </div>

      <!-- Sağ Pane (B) -->
      <div class="diff-pane">
        <div class="diff-pane-header">
          <span id="labelPaneB" class="diff-pane-title">Rapor 2</span>
          <div style="display:flex;align-items:center;gap:.4rem;">
            <span class="badge badge-green" id="badgePaneB" style="font-size:.68rem;">Karşılaştırılan</span>
            <button class="btn btn-sm btn-ghost cmp-pane-change" data-compare-action="picker" data-pane="B" title="Raporu Değiştir" style="font-size:.72rem;padding:2px 8px;">Değiştir</button>
          </div>
        </div>
        <div class="diff-scroll" id="scrollPaneB">
          <div class="diff-table" id="tablePaneB"></div>
        </div>
      </div>

      <!-- 3. Pane (C) — Gizli -->
      <div class="diff-pane" id="paneC" style="display:none;">
        <div class="diff-pane-header">
          <span id="labelPaneC" class="diff-pane-title">Rapor 3</span>
          <div style="display:flex;align-items:center;gap:.4rem;">
            <span class="badge badge-orange" id="badgePaneC" style="font-size:.68rem;">3. Panel</span>
            <button class="btn btn-sm btn-ghost cmp-pane-change" data-compare-action="picker" data-pane="C" title="Raporu Değiştir" style="font-size:.72rem;padding:2px 8px;">Değiştir</button>
          </div>
        </div>
        <div class="diff-scroll" id="scrollPaneC">
          <div class="diff-table" id="tablePaneC"></div>
        </div>
      </div>

    </div>
    <!-- VS Code stili Minimap -->
    <div class="diff-minimap" id="diffMinimap" title="Fark haritası — tıklayarak atla"></div>
  </div>

</div><!-- /cmp-shell -->

<!-- Toast Stack -->
<div id="toastCompare" class="toast-stack"></div>

<script src="js/core/highlight.js?v=4.3"></script>

<script src="js/core/snippet_modal.js?v=4.3"></script>
<script src="js/settings/tabs/appearance_tab.js?v=4.3"></script>
<script src="js/settings/tabs/profile_tab.js?v=4.3"></script>
<script src="js/settings/tabs/categories_tab.js?v=4.3"></script>

<script src="js/compare/diff.js?v=4.3"></script>

</body>
</html>
